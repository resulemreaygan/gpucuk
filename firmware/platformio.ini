; GPU'cuk firmware for the XTEINK X3 (ESP32-C3, 16 MB flash).
; Build: pio run    Flash (app partition only): ../tools/flash.sh
; Author: Resul Emre Aygan

[platformio]
default_envs = x3

[env:x3]
; Same platform release as CrossPoint Reader 1.6.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 7798784

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DFREEINK_DEVICE_X3=1
  -std=gnu++2a
build_unflags =
  -std=gnu++11

; FreeInk SDK is a git submodule (firmware/freeink-sdk); only the libraries GPU'cuk uses.
lib_deps =
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
